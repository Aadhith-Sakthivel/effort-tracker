line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",   # long lines (comments/f-strings) — formatter's job
  "B008",   # Depends() in arg defaults is the idiomatic FastAPI pattern
]

[lint.per-file-ignores]
"alembic/*" = ["F401"]
"tests/*" = ["E402"]           # imports after env setup are intentional in conftest
"app/main.py" = ["E402"]       # mimetypes.add_type() must run before fastapi imports
